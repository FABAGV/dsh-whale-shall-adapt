# 验证 + 发布。
#
# 为什么需要它：这个包不在 npm 上，用户拿到它只能靠 GitHub。所以"发一个版本"必须是
# 一条命令能完成的事 —— 打 tag 推上去，这里跑测试、把 npm 包形状的 tgz 挂到 Release，
# 于是 `install.ps1`、桌面端插件页、`dsh plugin add <url>` 三条路线都有一个**版本化、
# 内容不会变**的地址可以指向（`refs/heads/main` 那种地址是会变的）。
#
# 测试依赖 `@deepseek-ai/cordis` / `@deepseek-ai/schemastery`：真实宿主下这两个包由 DSH
# 装载时提供，CI 里没有 DSH，所以从 npm 装一份（两个包都已发布）。本地开发用
# README「开发与测试」那节的 junction 代替。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 测试（${{ matrix.os }} / Node ${{ matrix.node }}）
    # 今天修掉的两类问题都只在特定平台出现（Windows 上 process.exit 撞 libuv 断言；
    # Node 22 之前没有 node:sqlite）。只跑 Ubuntu + Node 24 会一直漏掉它们。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 宿主在运行时提供的两个 peer：CI 里从 npm 装（都已发布）。
      - name: 装宿主提供的 peer 依赖
        run: npm install --no-save --no-package-lock @deepseek-ai/cordis@4 @deepseek-ai/schemastery@3

      # 冒烟：老 Node 上整个插件必须还能加载（node:sqlite 曾经是静态 import，
      # Node 20–22.12 上一加载就炸，哪怕配置是 memory.store=json）。
      - name: 入口冒烟（加载不抛错）
        run: node -e "import('./lib/index.js').then(m => { if (!m.default?.apply) throw new Error('没有 apply'); console.log('入口 OK') })"

      # 全量单元测试走仓库自己的 runner：单文件超时、监听 close、隔离 HOME、
      # 缺 peer 时明确报错，而不是十几个 ERR_MODULE_NOT_FOUND 混在真失败里。
      # QQ 入口集成测试要真实端口，只在 Ubuntu 上跑（Windows runner 上耗时且易受端口占用影响）。
      - name: 跑测试
        env:
          DSH_SHALL_CONSOLE: 'off'
        run: node tools/run-tests.mjs ${{ matrix.os == 'windows-latest' && '--no-qq' || '' }}

      - name: 打包清单（不能混进 .orig / tgz 之类的垃圾）
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          set -e
          npm pack --dry-run --json > pack.json
          node -e "
            const j = require('./pack.json')[0];
            const bad = j.files.map(f => f.path).filter(p => /\.(orig|bak|tmp|tgz)$/.test(p));
            if (bad.length) { console.error('发布包里混进了：', bad.join(', ')); process.exit(1) }
            console.log('发布包', j.entryCount, '个文件，', (j.size/1024).toFixed(0), 'KB');
          "

  release:
    name: 发版
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 产物与 npm 发布的是同一个包形状（`files` 字段决定内容），
      # 所以 asset 名字必须与 README / install.ps1 里写的约定一致：
      #   dsh-whale-shall-adapt-<version>.tgz
      # 同时产出 `.sha256`：install.ps1 默认会下载它来校验（镜像通道可被篡改，
      # 而插件跑起来拥有宿主 agent 的文件 / shell 能力）。
      - name: 打包 + 校验和
        run: |
          set -e
          npm pack
          tgz=$(ls ./*.tgz)
          sha256sum "$tgz" > "$tgz.sha256"
          cat "$tgz.sha256"
          ls -l ./*.tgz*

      - name: 挂到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" ./*.tgz ./*.tgz.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  publish-npm:
    name: 发布到 npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm provenance（供应链可追溯）
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      # 本包还没发布到 npm（来源插件 dsh-prompt-adapt 发布过，这个合并后的包没有）。
      # 这一段仍然是"仓库里配了 NPM_TOKEN secret 才会跑"：没配时走最后那条 echo 跳过，
      # 主线（GitHub Release 产出 tgz）不受影响。想让打 tag 自动发版，就在 secrets 里配上它。
      - if: env.NPM_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: env.NPM_TOKEN == ''
        run: echo "未配置 NPM_TOKEN，跳过 npm 发布（GitHub Release 已经产出）"
